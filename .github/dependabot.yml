version: 2

updates:
  # 1. React Vite Frontend npm Dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "deps(frontend)"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
      - "automated"
    assignees:
      - "KrrishSR4"
    reviewers:
      - "KrrishSR4"
    versioning-strategy: increase
    groups:
      frontend-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  # 2. Go Backend Modules
  - package-ecosystem: "gomod"
    directory: "/backend"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "deps(backend)"
      include: "scope"
    labels:
      - "dependencies"
      - "backend"
      - "automated"
    assignees:
      - "KrrishSR4"
    reviewers:
      - "KrrishSR4"
    versioning-strategy: increase
    groups:
      backend-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"

  # 3. GitHub Actions Workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "04:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 30
    commit-message:
      prefix: "deps(ci)"
      include: "scope"
    labels:
      - "dependencies"
      - "ci"
      - "automated"
    assignees:
      - "KrrishSR4"
    reviewers:
      - "KrrishSR4"
    groups:
      actions-patch-minor:
        applies-to: version-updates
        update-types:
          - "patch"
          - "minor"
