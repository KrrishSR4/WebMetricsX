name: Dependabot Validation CI

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  dependabot-validate-frontend:
    name: Dependabot Frontend Check
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

      - name: Build Project
        run: npm run build

  dependabot-validate-backend:
    name: Dependabot Backend Check
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: backend/go.sum

      - name: Run Go Tests
        run: go test -v ./...

      - name: Build Go API
        run: go build -v ./cmd/api
