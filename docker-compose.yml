services:
  redis:
    image: redis:7-alpine
    container_name: webmetricsx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - webmetricsx-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: webmetricsx-backend
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - ./backend/.env
    environment:
      - PORT=8081
      - REDIS_URL=redis://redis:6379/0
      - CORS_ALLOWED_ORIGINS=http://localhost:8080,http://localhost:5173,http://localhost:8081,http://127.0.0.1:8080
    networks:
      - webmetricsx-net
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8081
    container_name: webmetricsx-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    env_file:
      - ./frontend/.env
    networks:
      - webmetricsx-net
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:

networks:
  webmetricsx-net:
    driver: bridge
